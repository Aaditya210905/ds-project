<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini BitTorrent Tracker Simulator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>🌐 Mini BitTorrent Tracker Simulator</h1>
        <p class="subtitle">Distributed Systems — P2P Tracker, Swarm, Seeders & Leechers</p>
    </header>

    <div class="container">
        <!-- Left Panel: Controls -->
        <div class="panel controls-panel">
            <h2>📋 Tracker Controls</h2>

            <!-- Register Torrent -->
            <div class="card">
                <h3>➕ Register New Torrent</h3>
                <div class="form-group">
                    <label>File Name</label>
                    <input type="text" id="torrent-name" placeholder="e.g., movie.mkv">
                </div>
                <div class="form-group">
                    <label>File Size</label>
                    <input type="text" id="torrent-size" placeholder="e.g., 1.5 GB">
                </div>
                <button onclick="registerTorrent()">Register Torrent</button>
            </div>

            <!-- Add Peer -->
            <div class="card">
                <h3>👤 Add Peer to Swarm</h3>
                <div class="form-group">
                    <label>Select Torrent</label>
                    <select id="peer-torrent"></select>
                </div>
                <div class="form-group">
                    <label>Peer Name</label>
                    <input type="text" id="peer-name" placeholder="e.g., Alice">
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <select id="peer-role">
                        <option value="leecher">Leecher (downloading)</option>
                        <option value="seeder">Seeder (has full file)</option>
                    </select>
                </div>
                <button onclick="addPeer()">Join Swarm</button>
            </div>

            <!-- Simulate Actions -->
            <div class="card">
                <h3>⚡ Simulate Actions</h3>
                <button class="btn-secondary" onclick="simulateRandomJoin()">Random Peer Joins</button>
                <button class="btn-secondary" onclick="simulateRandomLeave()">Random Peer Leaves</button>
                <button class="btn-secondary" onclick="simulateRandomPromote()">Random Leecher Completes Download</button>
            </div>
        </div>

        <!-- Center Panel: Torrent List & Swarm View -->
        <div class="panel main-panel">
            <h2>📡 Tracked Torrents</h2>
            <div id="torrent-list" class="torrent-list">
                <p class="loading">Loading...</p>
            </div>

            <h2 id="swarm-title" style="margin-top:20px;">🔍 Select a torrent to view its swarm</h2>
            <div id="swarm-view" class="swarm-view"></div>
        </div>

        <!-- Right Panel: Event Log -->
        <div class="panel log-panel">
            <h2>📜 Real-Time Event Log</h2>
            <div id="event-log" class="event-log">
                <p class="loading">Waiting for events...</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
